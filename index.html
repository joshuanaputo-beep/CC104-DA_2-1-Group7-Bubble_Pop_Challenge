<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bubble Pop Challenge</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-3 py-md-4 game-shell">
    <header class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-0">Bubble Pop Challenge</h1>
        <p class="mb-0 subtitle">Pop bubbles before they grow too big. Three bursts and it's over.</p>
      </div>
      <button id="btn-reset" class="btn btn-outline-light btn-sm">Reset</button>
    </header>

    <section class="row g-2 mb-3" aria-label="Game status">
      <div class="col-4"><div class="stat"><span class="stat-label">Score</span><span id="score" class="stat-value">0</span></div></div>
      <div class="col-4"><div class="stat"><span class="stat-label">Popped</span><span id="popped" class="stat-value">0</span></div></div>
      <div class="col-4">
        <div class="stat">
          <span class="stat-label">Lives</span>
          <span id="lives" class="stat-value" aria-live="polite">
            <i class="life"></i><i class="life"></i><i class="life"></i>
          </span>
        </div>
      </div>
    </section>

    <div id="game-area" role="application" aria-label="Bubble play area">
      <div id="overlay">
        <h2 id="overlay-title" class="h4">Ready?</h2>
        <p id="overlay-text">Click or tap a bubble to pop it. Bubbles turn red as they near bursting.</p>
        <button id="btn-start" class="btn btn-light btn-lg">Start game</button>
      </div>
    </div>

    <details id="data-panel" class="mt-3">
      <summary>Show the bubbles array (for demo)</summary>
      <pre id="data-view" class="mb-0"></pre>
    </details>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
